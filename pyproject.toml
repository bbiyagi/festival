[project]
name = "festival"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "uvicorn[standard]==0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
